name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "aegis-ai-backend/**"
      - "scripts/security/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "aegis-ai-backend/**"
      - "scripts/security/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Test and audit backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ENVIRONMENT: test
      DATABASE_PASSWORD: ci-database-password
      JWT_SECRET_KEY: ci-only-secret-key-do-not-use-outside-github-actions-1234567890

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            aegis-ai-backend/requirements.txt
            aegis-ai-backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: aegis-ai-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
          python -m pip install pip-audit

      - name: Create temporary CI Docker secret file
        run: |
          python - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe

          Path(".env.docker").write_text(
              f"POSTGRES_PASSWORD={token_urlsafe(32)}\n",
              encoding="utf-8",
          )
          PY

      - name: Validate secret protection
        run: |
          python scripts/security/validate_secret_protection.py

      - name: Check Python dependencies
        working-directory: aegis-ai-backend
        run: |
          python -m pip check

      - name: Run backend tests
        working-directory: aegis-ai-backend
        run: |
          python -m pytest -q

      - name: Audit Python dependencies
        working-directory: aegis-ai-backend
        run: |
          python -m pip_audit --requirement requirements.txt
