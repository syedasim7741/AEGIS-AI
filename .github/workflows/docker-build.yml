name: Docker Build

on:
  push:
    branches:
      - main
    paths:
      - "aegis-ai-backend/**"
      - "aegis-ai-frontend/**"
      - "docker/**"
      - "compose.yaml"
      - ".github/workflows/docker-build.yml"

  pull_request:
    branches:
      - main
    paths:
      - "aegis-ai-backend/**"
      - "aegis-ai-frontend/**"
      - "docker/**"
      - "compose.yaml"
      - ".github/workflows/docker-build.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build backend and frontend images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./aegis-ai-backend
          file: ./aegis-ai-backend/Dockerfile
          push: false
          load: true
          tags: aegis-ai-backend:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=aegis-backend
          cache-to: type=gha,mode=max,scope=aegis-backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./aegis-ai-frontend
          file: ./aegis-ai-frontend/Dockerfile
          push: false
          load: true
          tags: aegis-ai-frontend:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=aegis-frontend
          cache-to: type=gha,mode=max,scope=aegis-frontend

      - name: Verify backend image
        run: |
          docker image inspect aegis-ai-backend:ci
          docker run --rm aegis-ai-backend:ci \
            /opt/venv/bin/python -c \
            "import fastapi; print('FastAPI:', fastapi.__version__)"

      - name: Verify frontend image
        run: |
          docker image inspect aegis-ai-frontend:ci
          docker run --rm aegis-ai-frontend:ci \
            nginx -v

      - name: Display image summary
        run: |
          docker image ls aegis-ai-backend:ci
          docker image ls aegis-ai-frontend:ci
